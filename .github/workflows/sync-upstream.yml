name: Sync from node-disguise-dev

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out upstream
        uses: actions/checkout@v7
        with:
          repository: onlxltd/node-disguise-dev
          ref: main
          path: .upstream
          token: ${{ secrets.UPSTREAM_REPO_TOKEN }}
          persist-credentials: false

      - name: Sync upstream files
        shell: bash
        run: |
          set -euo pipefail

          rsync --archive --checksum --delete \
            --exclude-from=.upstream-sync-ignore \
            .upstream/ ./

          # Keep the secondary checkout out of the target repository's commit.
          printf '/.upstream/\n' >> .git/info/exclude

          git add --all
          if git diff --cached --quiet; then
            echo "No upstream changes to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync from node-disguise-dev"
          git push
